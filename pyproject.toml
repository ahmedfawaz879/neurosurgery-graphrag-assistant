[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosurgery-graphrag-assistant"
version = "0.1.0"
description = "GraphRAG research assistant over the neurosurgical-AI external-validation literature"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ahmed Fawaz" }]

dependencies = [
    # Scientific stack -- pinned to the exact versions confirmed to resolve
    # together on Kaggle (see the notebook's install cell / _pip_constraints.txt).
    # This is a floor for reproducibility, not a range: a production Dockerfile
    # does not need to re-run resolver roulette against an unknown pre-installed
    # image the way the notebook does.
    "numpy==2.0.2",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.6.1",

    # Orchestration / retrieval frameworks
    "langchain==1.3.16",
    "langchain-core==1.6.0",
    "langchain-community==0.4.2",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "llama-index-core==0.14.24",
    "llama-index-vector-stores-qdrant==0.10.3",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-vector-stores-pinecone==0.8.1",
    "pinecone==9.1.0",
    "qdrant-client==1.19.0",
    "networkx==3.6.1",

    # LLM backends
    "openai==3.5.0",
    "tiktoken==0.14.0",
    "sentence-transformers==6.0.0",
    "transformers==5.16.1",
    "torch==2.13.0",

    # Graph export (optional backend, default is NetworkX)
    "neo4j>=5.0,<6.0",

    # API service
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "slowapi==0.1.10",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "respx==0.23.1",
    "httpx==0.28.1",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
